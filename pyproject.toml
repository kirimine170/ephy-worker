[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ephy-worker"
version = "0.1.0"
description = "Bounded public web research executor for Ephy"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<0.29",
  "aiohttp>=3.12,<4",
  "PyYAML>=6.0,<7",
  "trafilatura>=2.0,<3",
  "pypdf>=6.0,<7",
  "psutil>=7.0,<8",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.0,<2", "reportlab>=4.4,<5", "ruff>=0.12,<1"]

[project.scripts]
ephy-worker = "ephy_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ephy_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
