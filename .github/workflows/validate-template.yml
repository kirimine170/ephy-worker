name: Validate template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked Worker dependencies
        run: uv sync --locked

      - name: Run offline tests
        run: uv run pytest -q

      - name: Validate repository and scan template text
        run: python scripts/validate_repository.py --check-sensitive-patterns
