name: Validate template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked Worker dependencies
        run: uv sync --locked

      - name: Run offline tests
        run: uv run pytest -q

      - name: Execute governance gate lifecycle smoke test
        run: >-
          node --experimental-strip-types
          --experimental-loader ./tests/governance-typebox-loader.mjs
          ./tests/governance-gate-smoke.mjs

      - name: Execute local Pi model router smoke test
        run: >-
          node --experimental-strip-types
          --experimental-loader ./tests/governance-typebox-loader.mjs
          ./tests/pi-model-router-smoke.mjs

      - name: Execute formal stage capability controls
        run: node --experimental-strip-types ./tests/formal-stage-guard-smoke.mjs

      - name: Verify provider stop survives swallowed extension errors
        run: node --experimental-strip-types ./tests/formal-stage-boundary-smoke.mjs

      - name: Check formal submission approval binding
        run: >-
          node --experimental-strip-types
          --experimental-loader ./tests/formal-submit-loader.mjs
          ./tests/formal-submit-smoke.mjs

      - name: Lint formal runner
        run: >-
          uv run ruff check src/ephy_worker/formal_artifacts.py
          src/ephy_worker/formal_runtime.py src/ephy_worker/formal_campaign.py
          tests/test_formal_runtime.py src/ephy_worker/coding_executor.py
          tests/test_coding_executor.py
          src/ephy_worker/strata_runtime.py tests/test_strata_runtime.py
          scripts/verify_pi_request_boundary.py
          src/ephy_worker/verifier_triage_evaluation.py
          src/ephy_worker/verifier_triage_consumer.py
          src/ephy_worker/verifier_triage_fixtures.py
          scripts/count_strata_consumer_tokens.py
          scripts/verify_triage_consumer_boundary.py
          tests/test_verifier_triage_evaluation.py
          tests/test_verifier_triage_consumer.py
          src/ephy_worker/verifier_triage_isolation.py
          scripts/verify_triage_generation_boundary.py
          tests/test_verifier_triage_isolation.py

      - name: Validate repository and scan template text
        run: python scripts/validate_repository.py --check-sensitive-patterns
