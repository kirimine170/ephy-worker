name: Validate template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked Worker dependencies
        run: uv sync --locked

      - name: Run offline tests
        run: uv run pytest -q

      - name: Execute governance gate lifecycle smoke test
        run: >-
          node --experimental-strip-types
          --experimental-loader ./tests/governance-typebox-loader.mjs
          ./tests/governance-gate-smoke.mjs

      - name: Execute local Pi model router smoke test
        run: >-
          node --experimental-strip-types
          --experimental-loader ./tests/governance-typebox-loader.mjs
          ./tests/pi-model-router-smoke.mjs

      - name: Validate repository and scan template text
        run: python scripts/validate_repository.py --check-sensitive-patterns
