# Opt-in local research and Discord answer policy．Credentials remain environment-only．
model_profiles:
  local:
    family: qwen
    base_url_env: EPHY_MODEL_BASE_URL
    model_id_env: EPHY_MODEL_ID
    output_mode: prompted_json
    context_tokens: 32768
    max_output_tokens: 4096
    timeout_seconds: 45
    schema_retries: 0
    enable_thinking: false
search:
  provider: tavily
  engine: tavily
  api_key_env: TAVILY_API_KEY
  retries: 0
limits:
  job_seconds: 300
  model_requests: 24
  max_queries: 8
  initial_sources: 4
answer_policy:
  enabled: true
  max_rounds: 4
  preflight_seconds: 20
  cache_ttl_seconds: 86400
  freshness_ttl_seconds: 300
  cache_max_entries: 64
  cache_max_bytes: 8388608
  snapshot_max_bytes: 524288
