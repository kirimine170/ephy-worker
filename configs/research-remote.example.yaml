# 調査PC側．検索providerのkeyは不要で，LLMとManagerだけへ接続する．
model_profiles:
  qwen-local:
    family: qwen
    base_url_env: EPHY_QWEN_BASE_URL
    model_id_env: EPHY_QWEN_MODEL_ID
    api: chat_completions
    output_mode: prompted_json
    context_tokens: 32768
    max_output_tokens: 4096
    max_tokens_parameter: max_tokens
    schema_retries: 1
    timeout_seconds: 120

remote:
  manager_url: http://127.0.0.1:8321
  requester_credential_env: EPHY_MANAGER_REQUESTER_CREDENTIAL
  target_worker_id: collector-01
  poll_interval_seconds: 2
  max_wait_seconds: 1800
  deadline_seconds: 1200

limits:
  max_queries: 10
  search_requests: 20
  max_sources: 12
  fetch_requests: 36
  model_requests: 40
  job_seconds: 1800
  request_seconds: 120
  initial_sources: 5
